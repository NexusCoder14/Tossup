<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F8F4EE"/>

  <!-- Four bin colour strips at top -->
  <rect x="0" y="0" width="300" height="8" fill="#1B6B3A"/>
  <rect x="300" y="0" width="300" height="8" fill="#1A5276"/>
  <rect x="600" y="0" width="300" height="8" fill="#922B3E"/>
  <rect x="900" y="0" width="300" height="8" fill="#A85D00"/>

  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="72" fill="#1C1917" letter-spacing="-2">Tossup</text>

  <!-- Subtitle -->
  <text x="600" y="330" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" font-size="28" fill="#57534E">Which bin does it go in?</text>

  <!-- Bin labels -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="18">
    <!-- Wet -->
    <rect x="200" y="420" width="140" height="44" rx="6" fill="#1B6B3A"/>
    <text x="270" y="448" text-anchor="middle" fill="#FFFFFF">Wet</text>

    <!-- Dry -->
    <rect x="380" y="420" width="140" height="44" rx="6" fill="#1A5276"/>
    <text x="450" y="448" text-anchor="middle" fill="#FFFFFF">Dry</text>

    <!-- Sanitary -->
    <rect x="560" y="420" width="140" height="44" rx="6" fill="#922B3E"/>
    <text x="630" y="448" text-anchor="middle" fill="#FFFFFF">Sanitary</text>

    <!-- Special -->
    <rect x="740" y="420" width="180" height="44" rx="6" fill="#A85D00"/>
    <text x="830" y="448" text-anchor="middle" fill="#FFFFFF">Special drop-off</text>
  </g>

  <!-- Bottom line -->
  <rect x="0" y="622" width="1200" height="8" fill="#1C1917"/>
</svg>
